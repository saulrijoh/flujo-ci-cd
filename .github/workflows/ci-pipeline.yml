name: CI Pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore MaquinaCafe.sln
      - name: Compilar proyecto
        run: dotnet build MaquinaCafe.sln --configuration Release --no-restore
      - name: Ejecutar pruebas
        run: dotnet test MaquinaCafe.sln --configuration Release --no-build --no-restore
